<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#000000" />
  <title>Page introuvable – DofuScripts</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem 1rem;
      text-align: center;
      box-sizing: border-box;
    }

    img {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      filter: drop-shadow(0 0 20px #ad46ff);
    }

    h1 {
      margin: .5rem 0 0;
      font-size: 2rem;
    }

    p {
      margin: 0;
      color: rgba(255, 255, 255, .7);
    }

    a {
      margin-top: 1rem;
      display: inline-block;
      padding: .8rem 1.4rem;
      border-radius: 15px;
      background: #a855f7;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: background .3s ease, box-shadow .3s ease;
    }

    a:hover {
      background: #9333ea;
      box-shadow: 0 0 12px rgba(168, 85, 247, .5);
    }
  </style>
</head>

<body>
  <main>
    <img src="/logo-96.png" alt="Logo DofuScripts" width="96" height="96">
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou a été déplacée.</p>
    <p lang="en">Page not found.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>

</html>
